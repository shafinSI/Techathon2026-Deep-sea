services:
  backend:
    build: ./soms-backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      AUTH_TOKEN: ${AUTH_TOKEN:-soms-dev-token}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      TICK_INTERVAL_MS: ${TICK_INTERVAL_MS:-6000}
      DEFAULT_KWH_RATE: ${DEFAULT_KWH_RATE:-0.14}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build: ./soms-frontend-wired
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
